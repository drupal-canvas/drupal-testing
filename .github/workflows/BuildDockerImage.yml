name: Create a Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A new push to the PR makes the previous build moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            image-suffix: ''
            platforms: linux/amd64,linux/arm64
            cache-from: type=gha,scope=default
            cache-to: type=gha,mode=max,scope=default
          - target: chromium
            image-suffix: '/chromium'
            platforms: linux/amd64,linux/arm64
            cache-from: type=gha,scope=chromium
            cache-to: type=gha,mode=max,scope=chromium
          # Matches the nightly publish: amd64 only, mode=min (see PublishDockerImage.yml).
          - target: canvas
            image-suffix: '/canvas'
            platforms: linux/amd64
            cache-from: |
              type=gha,scope=canvas
              type=gha,scope=chromium
            cache-to: type=gha,mode=min,scope=canvas
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}
          tags: |
            type=ref,event=pr
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
